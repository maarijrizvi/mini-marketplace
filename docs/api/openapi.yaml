      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutRequest' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntry' }
        '200':
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`insufficient_balance` or `not_a_seller`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/categories:
    post:
      operationId: postAdminCategories
      tags: [Admin]
      summary: Create a category
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`slug_taken`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      operationId: patchAdminCategoriesByCcategoryI
      tags: [Admin]
      summary: Edit a category
      description: |
        A `variantSchema` change may add option values, but can't remove a value an existing variant uses.
        `parentId` can't create a cycle.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`slug_taken`, `option_value_in_use` or `category_cycle`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteAdminCategoriesByCcategoryI
      tags: [Admin]
      summary: Delete a category
      security:
        - adminToken: []
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`category_in_use`: it has products or sub-categories'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/orders:
    get:
      operationId: getAdminOrders
      tags: [Admin]
      summary: Search orders
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: paymentMethod
          in: query
          schema: { $ref: '#/components/schemas/OrderPaymentMethod' }
        - name: q
          in: query
          description: Order id, customer email or tracking number.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getAdminOrdersByOorderI
      tags: [Admin]
      summary: Any order with its parcels and payments
      security:
        - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: postAdminOrdersByOorderICancel
      tags: [Admin]
      summary: Cancel an order
      description: Same rules and effects as the customer's cancel.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequiredReasonRequest' }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/payments:
    get:
      operationId: getAdminPayments
      tags: [Admin, Money]
      summary: Search payments
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/PaymentKind' }
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [Admin]
      summary: Read the audit log, newest first
      security:
        - adminToken: []
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: actorType
          in: query
          schema: { $ref: '#/components/schemas/ActorType' }
        - name: actorId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/jobs:
    get:
      operationId: getAdminJobs
      tags: [Admin]
      summary: Background jobs (graphile-worker)
      security:
        - adminToken: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [queued, running, failed]
        - name: task
          in: query
          schema: { $ref: '#/components/schemas/JobTask' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    delete:
      operationId: deleteAdminJobsByJjobI
      tags: [Admin]
      summary: Remove a job that can't succeed
      description: Only failed or queued jobs; the payload is kept in the audit log.
      security:
        - adminToken: []
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`job_running`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/jobs/{jobId}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: postAdminJobsByJjobIRetry
      tags: [Admin]
      summary: Run a failed job again now
      description: Resets its attempts. Safe because every job checks current state before acting.
      security:
        - adminToken: []
      responses:
        '200':
          description: Requeued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`job_running`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Webhooks ─────────────────────────
  /webhooks/payments:
    post:
      operationId: postWebhooksPayments
      tags: [Webhooks]
      summary: Payment gateway result
      description: |
        Charge succeeded: held items committed, order `placed`. Charge failed: the attempt is `failed`,
        held items are released and the order is `cancelled` (the customer checks out again). Refund
        result: the refund row becomes final.
        Repeat-safe: `provider_ref` is unique and a final row is never changed. Raw payload stored in the audit log.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhook' }
      responses:
        '200': { description: Accepted (also for repeats). }
        '401': { description: Bad signature. }

  /webhooks/leopards:
    post:
      operationId: postWebhooksLeopards
      tags: [Webhooks]
      summary: Leopards Courier parcel event
      description: |
        `picked_up` → parcel `shipped`, `picked_up_at` set. `delivered`, `refused`, `delivery_failed` → the
        matching parcel status. A delivered COD parcel records the COD payment and the seller's sale and
        commission ledger entries. Status only moves forward; a repeated event is a no-op.
        When every parcel is final, the order becomes `completed`.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeopardsWebhook' }
      responses:
        '200': { description: Accepted (also for repeats). }
        '401': { description: Bad signature. }
        '404': { description: Unknown tracking number. }

  # ───────────────────────── Sandbox ─────────────────────────
  /sandbox/payments/{paymentId}/complete:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      operationId: postSandboxPaymentsByPpaymentIComplete
      tags: [Sandbox]
      summary: Finish a simulated payment
      description: The simulated gateway page calls this; it then sends `/webhooks/payments` like a real gateway.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [succeeded, failed, no_answer]
                  description: '`no_answer` sends no webhook, to test the hold expiring.'
      responses:
        '202': { description: Webhook sent (or deliberately not). }
        '404': { $ref: '#/components/responses/NotFound' }

  /sandbox/leopards/{trackingNo}/events:
    parameters:
      - name: trackingNo
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: postSandboxLeopardsByTtrackingNEvents
      tags: [Sandbox]
      summary: Simulate a courier event
      description: Sends `/webhooks/leopards` like the real courier would.
      security:
        - userToken: []
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { $ref: '#/components/schemas/LeopardsEvent' }
      responses:
        '202': { description: Webhook sent. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Health ─────────────────────────
  /health/live:
    get:
      operationId: getHealthLive
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200': { description: Process is up. }

  /health/ready:
    get:
      operationId: getHealthReady
      tags: [Health]
      summary: Readiness probe
      description: Checks the database connection.
      security: []
      responses:
        '200': { description: Ready. }
        '503': { description: Not ready. }

components:
  securitySchemes:
    userToken:
      type: apiKey
      in: cookie
      name: mm_token
      description: Signed, expiring JWT for a `users` row. HttpOnly, SameSite=Lax. Nothing stored server-side.
    adminToken:
      type: apiKey
      in: cookie
      name: mm_admin_token
      description: Signed, expiring JWT for an `admins` row. Never accepted on user routes, and vice versa.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 of the raw body with the provider's shared secret.

  headers:
    UserTokenCookie:
      description: Sets or clears `mm_token`.
      schema: { type: string }
    AdminTokenCookie:
      description: Sets or clears `mm_admin_token`.
      schema: { type: string }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One key per attempt, reused on retry. Unique per user.
      schema: { type: string, minLength: 8, maxLength: 100 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque `nextCursor` from the previous page.
      schema: { type: string }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SellerOrderId:
      name: sellerOrderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  responses:
    ValidationError:
      description: '`validation_failed` with `fieldErrors`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`unauthenticated`: no valid token'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotApprovedSeller:
      description: '`not_approved_seller`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`not_found` (also for rows that exist but aren''t yours)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: '`invalid_transition`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: '`rate_limited`'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminUser:
      description: The user after the change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminUserView' }

  schemas:
    # ── Primitives ──
    Id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: A bigint key as a string.
      examples: ['10482']
    Money:
      type: integer
      minimum: 0
      description: Paisa. 129900 = Rs 1,299.
      examples: [129900]
    SignedMoney:
      type: integer
      description: Paisa, may be negative.
    Timestamp:
      type: string
      format: date-time
    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable.
          examples: [insufficient_stock]
        message:
          type: string
          description: For people; may change.
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        details:
          type: object
          description: Extra data for some codes, e.g. the new `quote` for `prices_changed`.

    # ── Enums (mirror the ERD) ──
    SellerStatus:
      type: string
      enum: [pending, approved, rejected, suspended]
    ProductStatus:
      type: string
      enum: [draft, active, archived]
    OrderStatus:
      type: string
      enum: [pending_payment, placed, completed, cancelled]
    OrderPaymentMethod:
      type: string
      enum: [cod, online]
    ParcelStatus:
      type: string
      enum: [pending, shipped, delivered, refused, delivery_failed, cancelled]
    ItemStatus:
      type: string
      enum: [active, dropped]
    Reservation:
      type: string
      enum: [held, committed, released]
    PaymentKind:
      type: string
      enum: [charge, refund]
    PaymentMethod:
      type: string
      enum: [cod, card, wallet]
    PaymentStatus:
      type: string
      enum: [pending, succeeded, failed]
    LedgerEntryType:
      type: string
      enum: [sale, commission, refund, payout]
    ActorType:
      type: string
      enum: [user, admin, system]
    LeopardsEvent:
      type: string
      enum: [picked_up, delivered, refused, delivery_failed]
    JobTask:
      type: string
      enum: [release_expired_reservation, book_leopards_pickup, send_email, issue_refund, post_ledger_entries]

    # ── Identity ──
    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: At least 8 characters with a letter and a digit.
    Phone:
      type: string
      description: Pakistani mobile number; stored in E.164, e.g. +923001234567.
    SignUpRequest:
      type: object
      required: [email, password, firstName, lastName, phone]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        phone: { $ref: '#/components/schemas/Phone' }
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { $ref: '#/components/schemas/Password' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { $ref: '#/components/schemas/Password' }
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        phone: { $ref: '#/components/schemas/Phone' }
    SellerApplicationRequest:
      type: object
      required: [shopName]
      properties:
        shopName: { type: string, minLength: 2, maxLength: 60 }
    User:
      type: object
      required: [id, email, firstName, lastName, phone, emailVerified, seller, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        emailVerified: { type: boolean }
        seller:
          description: Null until the user applies to sell.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SellerProfile'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    SellerProfile:
      type: object
      required: [shopName, status, statusReason]
      properties:
        shopName: { type: string }
        status: { $ref: '#/components/schemas/SellerStatus' }
        statusReason:
          type: [string, 'null']
          description: Why it was rejected or suspended.
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    AdminUserView:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [reviewedBy, orderCount]
          properties:
            reviewedBy:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/AdminRef'
            orderCount: { type: integer }
    Admin:
      type: object
      required: [id, email, fullName, lastLoginAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        fullName: { type: string }
        lastLoginAt:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Timestamp'
    AdminRef:
      type: object
      required: [id, fullName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fullName: { type: string }
    AdminEnvelope:
      type: object
      required: [admin]
      properties:
        admin: { $ref: '#/components/schemas/Admin' }
    AddressInput:
      type: object
      required: [label, recipient, phone, line1, city]
      properties:
        label: { type: string, maxLength: 30, examples: [Home] }
        recipient: { type: string, minLength: 1, maxLength: 120 }
        phone: { $ref: '#/components/schemas/Phone' }
        line1: { type: string, minLength: 1, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        area: { type: string, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        province: { type: string, maxLength: 100 }
        postalCode: { type: string, maxLength: 10 }
    Address:
      allOf:
        - type: object
          required: [id, isDefault]
          properties:
            id:
              type: string
              format: uuid
              description: Made by the app; stable inside the JSONB list.
            isDefault: { type: boolean }
        - $ref: '#/components/schemas/AddressInput'
    ShippingAddress:
      description: The address as copied onto the order at checkout.
      $ref: '#/components/schemas/AddressInput'
    AddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Address' }

    # ── Catalog ──
    VariantSchema:
      type: object
      description: 'Allowed values per option name, e.g. `{ "size": ["S","M","L"], "colour": ["red","blue"] }`.'
      additionalProperties:
        type: array
        items: { type: string }
        minItems: 1
    VariantOptions:
      type: object
      description: 'One value per option name, e.g. `{ "size": "M", "colour": "red" }`.'
      additionalProperties: { type: string }
    Category:
      type: object
      required: [id, parentId, name, slug, variantSchema]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        parentId:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        name: { type: string }
        slug: { type: string }
        variantSchema: { $ref: '#/components/schemas/VariantSchema' }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 60 }
        parentId:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        variantSchema: { $ref: '#/components/schemas/VariantSchema' }
    CategoryUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 60 }
        parentId:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        variantSchema: { $ref: '#/components/schemas/VariantSchema' }
    ImageUrl:
      type: string
      format: uri
    SellerRef:
      type: object
      required: [id, shopName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        shopName: { type: string }
    ProductSummary:
      type: object
      required: [id, name, seller, categoryId, image, priceFrom, priceTo, inStock]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        seller: { $ref: '#/components/schemas/SellerRef' }
        categoryId: { $ref: '#/components/schemas/Id' }
        image:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ImageUrl'
        priceFrom: { $ref: '#/components/schemas/Money' }
        priceTo: { $ref: '#/components/schemas/Money' }
        inStock: { type: boolean }
    Variant:
      type: object
      required: [id, options, price, available, images]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        options: { $ref: '#/components/schemas/VariantOptions' }
        price: { $ref: '#/components/schemas/Money' }
        available:
          type: integer
          minimum: 0
          description: '`on_hand − reserved`'
        images:
          type: array
          description: The variant's own images, else the product's.
          items: { $ref: '#/components/schemas/ImageUrl' }
    ProductDetail:
      type: object
      required: [id, name, description, seller, category, optionNames, images, variants]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: string }
        seller: { $ref: '#/components/schemas/SellerRef' }
        category: { $ref: '#/components/schemas/Category' }
        optionNames:
          type: array
          items: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageUrl' }
        variants:
          type: array
          description: Active variants only.
          items: { $ref: '#/components/schemas/Variant' }
    ProductInput:
      type: object
      required: [categoryId, name, description, optionNames]
      properties:
        categoryId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        optionNames:
          type: array
          items: { type: string }
          uniqueItems: true
        images:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ImageUrl' }
    ProductUpdate:
      type: object
      minProperties: 1
      properties:
        categoryId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        optionNames:
          type: array
          items: { type: string }
          uniqueItems: true
        images:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ImageUrl' }
    SellerVariant:
      type: object
      required: [id, sku, options, price, onHand, reserved, available, images, isActive]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sku: { type: string }
        options: { $ref: '#/components/schemas/VariantOptions' }
        price: { $ref: '#/components/schemas/Money' }
        onHand: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageUrl' }
        isActive: { type: boolean }
    SellerProduct:
      type: object
      required: [id, categoryId, name, description, optionNames, images, status, variants, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        categoryId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: string }
        optionNames:
          type: array
          items: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageUrl' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/SellerVariant' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    VariantInput:
      type: object
      required: [sku, options, price, onHand]
      properties:
        sku: { type: string, pattern: '^[A-Za-z0-9._-]{1,40}$' }
        options: { $ref: '#/components/schemas/VariantOptions' }
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
            - minimum: 1
        onHand: { type: integer, minimum: 0 }
        images:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ImageUrl' }
    VariantUpdate:
      type: object
      minProperties: 1
      properties:
        sku: { type: string, pattern: '^[A-Za-z0-9._-]{1,40}$' }
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
            - minimum: 1
        images:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ImageUrl' }
        isActive: { type: boolean }
    StockAdjustment:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          not: { const: 0 }
        reason: { type: string, minLength: 1, maxLength: 200 }

    # ── Cart ──
    AddToCartRequest:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { $ref: '#/components/schemas/Id' }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    CartItemUpdate:
      type: object
      minProperties: 1
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }
        selected: { type: boolean }
    CartSelectionRequest:
      type: object
      required: [selected]
      properties:
        selected: { type: boolean }
        variantIds:
          type: array
          description: Omit to apply to every line.
          items: { $ref: '#/components/schemas/Id' }
    CartLine:
      type: object
      required: [variantId, productId, name, options, image, unitPrice, quantity, lineTotal, available, purchasable, selected]
      properties:
        variantId: { $ref: '#/components/schemas/Id' }
        productId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        options: { $ref: '#/components/schemas/VariantOptions' }
        image:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ImageUrl'
        unitPrice: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer }
        lineTotal: { $ref: '#/components/schemas/Money' }
        available: { type: integer }
        purchasable:
          type: boolean
          description: False when the variant, product or seller is no longer sellable, or stock is short.
        selected: { type: boolean }
    CartSellerGroup:
      type: object
      required: [seller, lines]
      properties:
        seller: { $ref: '#/components/schemas/SellerRef' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
    Cart:
      type: object
      required: [groups, selectedCount, selectedSubtotal]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/CartSellerGroup' }
        selectedCount: { type: integer }
        selectedSubtotal:
          $ref: '#/components/schemas/Money'
          description: Items only; shipping is added at checkout.

    # ── Checkout ──
    QuoteRequest:
      type: object
      required: [addressId]
      properties:
        addressId: { type: string, format: uuid }
    QuoteParcel:
      type: object
      required: [seller, lines, itemsTotal, shippingFee, total]
      properties:
        seller: { $ref: '#/components/schemas/SellerRef' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        itemsTotal: { $ref: '#/components/schemas/Money' }
        shippingFee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    Quote:
      type: object
      required: [parcels, itemsTotal, shippingTotal, total]
      properties:
        parcels:
          type: array
          items: { $ref: '#/components/schemas/QuoteParcel' }
        itemsTotal: { $ref: '#/components/schemas/Money' }
        shippingTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    CheckoutRequest:
      type: object
      required: [addressId, paymentMethod, expectedTotal]
      properties:
        addressId: { type: string, format: uuid }
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          description: '`cod` sets `orders.payment_method` = cod; `card` or `wallet` sets it to online.'
        expectedTotal:
          $ref: '#/components/schemas/Money'
          description: The total the customer saw; a mismatch returns `409 prices_changed`.
    PaymentRedirect:
      type: object
      required: [paymentId, redirectUrl]
      properties:
        paymentId: { $ref: '#/components/schemas/Id' }
        redirectUrl: { type: string, format: uri }
    CheckoutResult:
      type: object
      required: [order, payment]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        payment:
          description: Null for COD.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PaymentRedirect'

    # ── Orders ──
    OrderItem:
      type: object
      required: [id, variantId, productName, options, unitPrice, quantity, lineTotal, status, reservation]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        variantId: { $ref: '#/components/schemas/Id' }
        productName: { type: string, description: Snapshot at checkout. }
        options: { $ref: '#/components/schemas/VariantOptions' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer, minimum: 1 }
        lineTotal: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/ItemStatus' }
        reservation: { $ref: '#/components/schemas/Reservation' }
    Parcel:
      type: object
      required: [id, seller, status, itemsTotal, shippingFee, codAmount, trackingNo, shipDeadline, pickedUpAt, items]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        seller: { $ref: '#/components/schemas/SellerRef' }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        itemsTotal:
          $ref: '#/components/schemas/Money'
          description: Active items only.
        shippingFee: { $ref: '#/components/schemas/Money' }
        codAmount:
          description: Cash the courier collects; null for online orders.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        trackingNo:
          type: [string, 'null']
          description: Set once a pickup is booked.
        shipDeadline: { $ref: '#/components/schemas/Timestamp' }
        pickedUpAt:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Timestamp'
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    OrderSummary:
      type: object
      required: [id, status, paymentMethod, total, parcelCount, placedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { $ref: '#/components/schemas/OrderPaymentMethod' }
        total: { $ref: '#/components/schemas/Money' }
        parcelCount: { type: integer }
        placedAt: { $ref: '#/components/schemas/Timestamp' }
    Order:
      type: object
      required: [id, status, paymentMethod, total, refunded, shippingAddress, reservedUntil, placedAt, parcels, payments]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { $ref: '#/components/schemas/OrderPaymentMethod' }
        total:
          $ref: '#/components/schemas/Money'
          description: What was agreed at checkout; never edited.
        refunded:
          $ref: '#/components/schemas/Money'
          description: Sum of succeeded refunds.
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        reservedUntil:
          description: When held stock is released if unpaid; null for COD or once paid.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Timestamp'
        placedAt: { $ref: '#/components/schemas/Timestamp' }
        parcels:
          type: array
          items: { $ref: '#/components/schemas/Parcel' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
    SellerOrderItem:
      allOf:
        - $ref: '#/components/schemas/OrderItem'
        - type: object
          required: [sku, commissionBps]
          properties:
            sku: { type: string }
            commissionBps:
              type: integer
              description: Platform commission copied at checkout. 1000 = 10%.
    SellerParcel:
      type: object
      required: [id, orderId, status, itemsTotal, shippingFee, codAmount, trackingNo, shipDeadline, pickedUpAt, late, shippingAddress, items, placedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orderId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        itemsTotal: { $ref: '#/components/schemas/Money' }
        shippingFee: { $ref: '#/components/schemas/Money' }
        codAmount:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Money'
        trackingNo: { type: [string, 'null'] }
        shipDeadline: { $ref: '#/components/schemas/Timestamp' }
        pickedUpAt:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Timestamp'
        late:
          type: boolean
          description: Not picked up by `shipDeadline`.
        shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SellerOrderItem' }
        placedAt: { $ref: '#/components/schemas/Timestamp' }
    ReasonRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    RequiredReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    DropItemRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [out_of_stock, damaged, cannot_ship_to_address, other]
        note: { type: string, maxLength: 500 }

    # ── Money ──
    Payment:
      type: object
      required: [id, orderId, sellerOrderId, orderItemId, refundOf, kind, method, status, amount, providerRef, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orderId: { $ref: '#/components/schemas/Id' }
        sellerOrderId:
          description: Set for COD collections.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        orderItemId:
          description: Set for item refunds.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        refundOf:
          description: The charge a refund comes from.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        kind: { $ref: '#/components/schemas/PaymentKind' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        providerRef: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    LedgerEntry:
      type: object
      required: [id, sellerId, sellerOrderId, entryType, amount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sellerId: { $ref: '#/components/schemas/Id' }
        sellerOrderId:
          description: Null for payouts.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        entryType: { $ref: '#/components/schemas/LedgerEntryType' }
        amount:
          $ref: '#/components/schemas/SignedMoney'
          description: sale +, commission −, refund −, payout −.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    Balance:
      type: object
      required: [balance]
      properties:
        balance: { $ref: '#/components/schemas/SignedMoney' }
    PayoutRequest:
      type: object
      required: [amount]
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
            - minimum: 1
        note: { type: string, maxLength: 200 }

    # ── Operations ──
    AuditEntry:
      type: object
      required: [id, actorType, actorId, entityType, entityId, action, data, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorId:
          description: users.id or admins.id; null for system.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Id'
        entityType: { type: string, examples: [seller_order] }
        entityId: { $ref: '#/components/schemas/Id' }
        action: { type: string, examples: [item_dropped] }
        data:
          type: object
          description: Details, including raw webhook payloads.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    Job:
      type: object
      required: [id, task, payload, attempts, maxAttempts, lastError, runAt, lockedAt, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        task: { $ref: '#/components/schemas/JobTask' }
        payload: { type: object }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastError: { type: [string, 'null'] }
        runAt: { $ref: '#/components/schemas/Timestamp' }
        lockedAt:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Timestamp'
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    # ── Webhooks ──
    PaymentWebhook:
      type: object
      required: [eventId, providerRef, paymentId, kind, status]
      properties:
        eventId: { type: string }
        providerRef: { type: string, description: The gateway's transaction id. }
        paymentId: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/PaymentKind' }
        status:
          type: string
          enum: [succeeded, failed]
        failureReason: { type: string }
    LeopardsWebhook:
      type: object
      required: [eventId, trackingNo, event, occurredAt]
      properties:
        eventId: { type: string }
        trackingNo: { type: string }
        event: { $ref: '#/components/schemas/LeopardsEvent' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        codCollected:
          $ref: '#/components/schemas/Money'
          description: On `delivered` for COD parcels.
