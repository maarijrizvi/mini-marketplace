openapi: 3.1.0
info:
  title: Mini Marketplace API
  version: 1.0.0-draft
  summary: Multi-seller marketplace with COD and online payment, one parcel per seller.
  description: |
    Contract for the Mini Marketplace HTTP API, derived from `the_ERD.pdf` and the API design doc.

    Conventions that apply to every operation:

    - **IDs** are `bigint` keys sent as strings of digits (`"10482"`).
    - **Money** is integer paisa (`129900` = Rs 1,299). Never floats or formatted strings.
    - **Times** are ISO 8601 in UTC.
    - **Errors** are `{ code, message, fieldErrors? }` with a stable machine-readable `code`.
    - **Lists** use cursor pagination: `?limit=&cursor=` returns `{ items, nextCursor }`.
    - **Status changes** are action endpoints, never a `PATCH` of `status`. A move the state machine
      doesn't allow returns `409 invalid_transition`.
    - **Ownership:** a row that exists but isn't yours returns `404`, so ids can't be probed.
    - **Retries:** operations that take an `Idempotency-Key` header return the first result again for a
      repeated key (`200` instead of `201`).
    - **Audit:** every write adds an `audit_log` row with the actor; webhook payloads are stored as received.
    - Every response carries `X-Request-Id`.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Me
  - name: Catalog
  - name: Seller catalog
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Seller orders
  - name: Money
  - name: Admin
  - name: Webhooks
  - name: Sandbox
    description: Simulated payment gateway and Leopards Courier. Disabled in production.
  - name: Health

security:
  - userToken: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/signup:
    post:
      operationId: postAuthSignup
      tags: [Auth]
      summary: Create a customer account
      description: Creates an unverified `users` row and emails a verification link. Does not sign in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: Account created; verification email queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`email_taken`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verify-email:
    post:
      operationId: postAuthVerifyEmail
      tags: [Auth]
      summary: Confirm an email from the emailed link and sign in
      description: Sets `users.email_verified_at`. The token is signed and short-lived; no table stores it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Verified and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/UserTokenCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400':
          description: '`invalid_token` or `token_expired`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/resend-verification:
    post:
      operationId: postAuthResendVerification
      tags: [Auth]
      summary: Email a new verification link
      description: Answers the same whether or not the email exists or is already verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Accepted. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/signin:
    post:
      operationId: postAuthSignin
      tags: [Auth]
      summary: Sign in as a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/UserTokenCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401':
          description: '`invalid_credentials`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`email_not_verified`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/signout:
    post:
      operationId: postAuthSignout
      tags: [Auth]
      summary: Sign out
      description: Clears the cookie. Tokens are stateless, so a copied token stays valid until it expires.
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie: { $ref: '#/components/headers/UserTokenCookie' }

  /auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags: [Auth]
      summary: Email a password reset link
      description: Answers the same whether or not the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Accepted. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      operationId: postAuthResetPassword
      tags: [Auth]
      summary: Set a new password from the emailed link
      description: |
        The reset token embeds a fingerprint of the current `password_hash`, so it stops working once
        the password changes and can't be used twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password changed. }
        '400':
          description: '`invalid_token`, `token_expired` or field errors on `password`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/auth/signin:
    post:
      operationId: postAdminAuthSignin
      tags: [Auth]
      summary: Sign in as an admin
      description: Checks the `admins` table only and sets `last_login_at`. An inactive admin gets `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/AdminTokenCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEnvelope' }
        '401':
          description: '`invalid_credentials`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/auth/signout:
    post:
      operationId: postAdminAuthSignout
      tags: [Auth]
      summary: Sign out an admin
      security:
        - adminToken: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie: { $ref: '#/components/headers/AdminTokenCookie' }

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [Auth]
      summary: The signed-in admin
      security:
        - adminToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── Me ─────────────────────────
  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The signed-in user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: patchMe
      tags: [Me]
      summary: Update name or phone
      description: Never changes email or seller fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/password:
    post:
      operationId: postMePassword
      tags: [Me]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Changed. }
        '400':
          description: '`wrong_password` or field errors on `newPassword`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/addresses:
    get:
      operationId: getMeAddresses
      tags: [Me]
      summary: Saved addresses, default first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: postMeAddresses
      tags: [Me]
      summary: Add an address
      description: Appended to `users.addresses`; the first address added becomes the default.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Added. Returns the full list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    patch:
      operationId: patchMeAddressesByAaddressI
      tags: [Me]
      summary: Edit an address
      description: Past orders keep their own copy in `orders.shipping_address`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated. Returns the full list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMeAddressesByAaddressI
      tags: [Me]
      summary: Remove an address
      description: Removing the default makes the next one the default.
      responses:
        '200':
          description: Removed. Returns the full list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/addresses/{addressId}/default:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    post:
      operationId: postMeAddressesByAaddressIDefault
      tags: [Me]
      summary: Make an address the default
      description: Moves it to the front of the list.
      responses:
        '200':
          description: OK. Returns the full list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/seller-application:
    post:
      operationId: postMeSellerApplication
      tags: [Me]
      summary: Apply to sell
      description: Sets `shop_name` and `seller_status` = `pending`. Allowed again after a rejection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SellerApplicationRequest' }
      responses:
        '200':
          description: Application submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`shop_name_taken`, or `invalid_transition` when already pending, approved or suspended'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Catalog ─────────────────────────
  /categories:
    get:
      operationId: getCategories
      tags: [Catalog]
      summary: All categories
      description: Flat list with `parentId`; clients build the tree.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }

  /categories/{slug}:
    get:
      operationId: getCategoriesBySslu
      tags: [Catalog]
      summary: One category by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      operationId: getProducts
      tags: [Catalog]
      summary: Browse and search products
      description: |
        Only `active` products of `approved` sellers with at least one active variant.
        Price filters and sorting use the lowest active variant price.
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          description: Category slug; includes its sub-categories.
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: maxPrice
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: options
          in: query
          description: Variant option filters, e.g. `options[colour]=red&options[size]=M`.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
        - name: inStock
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, newest, price_asc, price_desc]
            default: relevance
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductSummary' }

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProductsByPproductI
      tags: [Catalog]
      summary: Product detail with its active variants
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Seller catalog ─────────────────────────
  /seller/products:
    get:
      operationId: getSellerProducts
      tags: [Seller catalog]
      summary: Own products
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - name: q
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SellerProduct' }
        '403': { $ref: '#/components/responses/NotApprovedSeller' }
    post:
      operationId: postSellerProducts
      tags: [Seller catalog]
      summary: Create a product (draft)
      description: '`optionNames` must be keys of the category''s `variantSchema`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created as `draft`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/NotApprovedSeller' }

  /seller/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getSellerProductsByPproductI
      tags: [Seller catalog]
      summary: One own product with all its variants
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProduct' }
        '403': { $ref: '#/components/responses/NotApprovedSeller' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchSellerProductsByPproductI
      tags: [Seller catalog]
      summary: Edit product details
      description: '`optionNames` can only change while the product has no variants.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /seller/products/{productId}/publish:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: postSellerProductsByPproductIPublish
      tags: [Seller catalog]
      summary: Publish (draft → active)
      responses:
        '200':
          description: Now active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProduct' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invalid_transition` or `no_active_variant`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /seller/products/{productId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: postSellerProductsByPproductIArchive
      tags: [Seller catalog]
      summary: Archive (draft or active → archived)
      description: Hides it everywhere; past orders keep their snapshots.
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerProduct' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /seller/products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: postSellerProductsByPproductIVariants
      tags: [Seller catalog]
      summary: Add a variant
      description: |
        `options` must set exactly the product's `optionNames`, each to a value allowed by the category's
        `variantSchema`. `options` is unique per product and `sku` unique per seller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerVariant' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`sku_taken` or `options_taken`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /seller/variants/{variantId}:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    patch:
      operationId: patchSellerVariantsByVvariantI
      tags: [Seller catalog]
      summary: Edit a variant
      description: A price change is audited and never alters placed orders. `options` can't change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerVariant' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`sku_taken`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /seller/variants/{variantId}/stock:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    post:
      operationId: postSellerVariantsByVvariantIStock
      tags: [Seller catalog]
      summary: Adjust stock on hand
      description: Changes `on_hand` by `delta` under a row lock. Audited with the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustment' }
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerVariant' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`below_reserved`: `on_hand` would drop under `reserved`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Cart ─────────────────────────
  /me/cart:
    get:
      operationId: getMeCart
      tags: [Cart]
      summary: The cart, grouped by seller
      description: Prices are read live from the variants; nothing is stored in the cart.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/cart/items:
    post:
      operationId: postMeCartItems
      tags: [Cart]
      summary: Add a variant
      description: If the variant is already in the cart its quantity goes up. New lines start ticked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddToCartRequest' }
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`variant_unavailable` or `insufficient_stock`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/cart/items/{variantId}:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    patch:
      operationId: patchMeCartItemsByVvariantI
      tags: [Cart]
      summary: Change quantity or tick state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemUpdate' }
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`insufficient_stock`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMeCartItemsByVvariantI
      tags: [Cart]
      summary: Remove a line
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/cart/selection:
    post:
      operationId: postMeCartSelection
      tags: [Cart]
      summary: Tick or untick many lines
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartSelectionRequest' }
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── Checkout ─────────────────────────
  /checkout/quote:
    post:
      operationId: postCheckoutQuote
      tags: [Checkout]
      summary: Price the ticked lines
      description: One parcel per seller, each with its shipping fee. Reserves nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`nothing_selected`, `variant_unavailable` or `insufficient_stock`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /checkout:
    post:
      operationId: postCheckout
      tags: [Checkout]
      summary: Place an order from the ticked lines
      description: |
        In one transaction: re-prices the ticked lines, locks the variants in id order, adds each quantity
        to `reserved`, creates the order, one `seller_orders` row per seller and the `order_items` with
        snapshots (name, options, unit price, commission rate), and removes the lines from the cart.

        - **COD:** items are `committed` at once and the order is `placed`.
        - **Card or wallet:** items are `held` until `reserved_until`, the order is `pending_payment`, and
          a charge attempt is created. The response carries the gateway redirect.

        A repeated `Idempotency-Key` returns the original order with `200`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResult' }
        '200':
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `prices_changed` (the error carries the new `quote` in `details`), `nothing_selected`,
            `variant_unavailable`, `insufficient_stock`, or `idempotency_key_reused` with a different body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Orders (customer) ─────────────────────────
  /me/orders:
    get:
      operationId: getMeOrders
      tags: [Orders]
      summary: Own orders, newest first
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getMeOrdersByOorderI
      tags: [Orders]
      summary: One own order with parcels, items, charges and refunds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: postMeOrdersByOorderICancel
      tags: [Orders]
      summary: Cancel the whole order
      description: |
        Allowed while the order is `pending_payment` or `placed` and no parcel has been picked up.
        Releases every item's stock, cancels every parcel, and queues refunds for succeeded online charges.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invalid_transition`: already cancelled or completed, or a parcel has shipped'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Orders (seller) ─────────────────────────
  /seller/orders:
    get:
      operationId: getSellerOrders
      tags: [Seller orders]
      summary: Own parcels
      description: Only parcels of orders that are `placed` or later; unpaid online orders are hidden.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ParcelStatus' }
        - name: late
          in: query
          description: Only parcels not picked up by `ship_deadline`.
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SellerParcel' }
        '403': { $ref: '#/components/responses/NotApprovedSeller' }

  /seller/orders/{sellerOrderId}:
    parameters:
      - $ref: '#/components/parameters/SellerOrderId'
    get:
      operationId: getSellerOrdersBySsellerOrderI
      tags: [Seller orders]
      summary: One own parcel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerParcel' }
        '404': { $ref: '#/components/responses/NotFound' }

  /seller/orders/{sellerOrderId}/items/{itemId}/drop:
    parameters:
      - $ref: '#/components/parameters/SellerOrderId'
      - $ref: '#/components/parameters/ItemId'
    post:
      operationId: postSellerOrdersBySsellerOrderIItemsByIitemIDrop
      tags: [Seller orders]
      summary: Drop an item the seller can't fulfil
      description: |
        Only while the parcel is `pending`. The item becomes `dropped` and its stock is released.
        Online order: a refund for the item is queued. COD order: `cod_amount` goes down.
        Dropping the last active item cancels the parcel; when every parcel is cancelled, the order is too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DropItemRequest' }
      responses:
        '200':
          description: Dropped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerParcel' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invalid_transition`: item already dropped or parcel not `pending`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /seller/orders/{sellerOrderId}/book-pickup:
    parameters:
      - $ref: '#/components/parameters/SellerOrderId'
    post:
      operationId: postSellerOrdersBySsellerOrderIBookPickup
      tags: [Seller orders]
      summary: Book a Leopards pickup
      description: Queues the `book_leopards_pickup` job; it stores `tracking_no`. Repeat calls are no-ops.
      responses:
        '202':
          description: Booking queued, or already booked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerParcel' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invalid_transition`: parcel not `pending`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Money ─────────────────────────
  /seller/ledger:
