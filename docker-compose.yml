# Local development: Postgres, SQS (LocalStack) and a mail catcher.
# Apps run on the host with `npm run dev:*` so they reload on change.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: mini_marketplace
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mm -d mini_marketplace']
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: eu-west-1
    ports:
      - '4566:4566'
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/mm-queues-ready']
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web inbox at http://localhost:8025

volumes:
  pgdata:
