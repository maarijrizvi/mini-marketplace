# Single entry point: the browser only ever talks to this server, so sign-in cookies stay first-party.
#   /api/*    → FastAPI (Swagger UI at /api/docs)
#   /media/*  → uploaded product images, straight from the shared volume
#   /mailpit/ → the Mailpit inbox where every email lands
#   /*        → Next.js
#
# Upstreams are looked up through Docker's DNS on each request (with a short cache) rather than once at start-up,
# so rebuilding a container (which gives it a new IP) doesn't leave nginx sending traffic to the old address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 6m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;
    set $mailpit_upstream http://mailpit:8025;

    # Security headers for every response (QA-03). The CSP for the web app is in `location /` below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 60s;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        # add_header in a location replaces the server-level ones, so repeat them.
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /mailpit/ {
        proxy_pass $mailpit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        # Next.js inlines its bootstrap scripts and styles, so 'unsafe-inline' is needed for those two.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
